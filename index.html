    <script>
      (function() {
        var src = '%VITE_UMAMI_URL%';
        var id = '%VITE_UMAMI_WEBSITE_ID%';
        if (src && id && !src.includes('VITE_')) {
          var s = document.createElement('script');
          s.defer = true;
          s.src = src;
          s.dataset.websiteId = id;
          document.head.appendChild(s);
        }
      })();
    </script>
